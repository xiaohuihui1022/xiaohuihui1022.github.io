<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>页面走丢了</title>
<style>
  /* 自包含样式：不依赖站点路径，项目站点（/repo/）下也能正常显示 */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background: #fbf7f5;
    color: #40394a;
    font-family: "Quicksand", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.8;
  }
  .blob { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; }
  .a { width: 44vw; height: 44vw; top: -10vw; right: -8vw; background: radial-gradient(circle, rgba(229,132,158,.42), transparent 68%); }
  .b { width: 40vw; height: 40vw; bottom: -8vw; left: -10vw; background: radial-gradient(circle, rgba(185,164,227,.32), transparent 70%); }
  .card {
    position: relative;
    width: min(480px, 100%);
    padding: 40px 34px 34px;
    text-align: center;
    background: #fff;
    border: 1px solid #efe2e7;
    border-radius: 26px;
    box-shadow: 0 24px 60px -30px rgba(150,110,130,.45);
  }
  .mark { font-size: 30px; color: #e5849e; letter-spacing: .3em; padding-left: .3em; }
  h1 { font-size: 21px; margin: 14px 0 10px; font-weight: 600; }
  p { margin: 0 0 24px; font-size: 13.5px; color: #7d7387; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 42px; padding: 0 22px; border-radius: 999px;
    background: #e5849e; color: #432b34; font-size: 14px; font-weight: 600;
    text-decoration: none; transition: transform .2s, box-shadow .2s;
    box-shadow: 0 10px 24px -14px rgba(229,132,158,.9);
  }
  a.btn:hover { transform: translateY(-2px); }
  .tip { margin-top: 18px; font-size: 11.5px; color: #a89eb3; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1a22; color: #ece7f0; }
    .card { background: #262331; border-color: #37323f; box-shadow: 0 24px 60px -30px rgba(0,0,0,.8); }
    p { color: #b2a9bd; }
    .mark { color: #f0a0b8; }
    a.btn { background: #f0a0b8; color: #2a1f27; }
    .tip { color: #877e95; }
  }
</style>
</head>
<body>
  <span class="blob a"></span>
  <span class="blob b"></span>
  <div class="card">
    <div class="mark">✧ ✧ ✧</div>
    <h1>这一页走丢了</h1>
    <p>可能是链接写错了，也可能它已经被收起来。<br />正在带你回到首页…</p>
    <a class="btn" id="home" href="./">回到首页</a>
    <div class="tip">如果一直没有跳转，点上面的按钮就好</div>
  </div>
  <script>
    (function () {
      // 判断站点根目录：项目站点在 /<repo>/ 下，用户站点在 /
      function guessBase() {
        var seg = location.pathname.split("/").filter(Boolean);
        if (!seg.length) return Promise.resolve("/");
        var candidate = "/" + seg[0] + "/index.html";
        return fetch(candidate, { method: "HEAD", cache: "no-store" })
          .then(function (r) { return r.ok ? "/" + seg[0] + "/" : "/"; })
          .catch(function () { return "/"; });
      }
      guessBase().then(function (base) {
        document.getElementById("home").setAttribute("href", base + "#/");
        setTimeout(function () { location.replace(base + "#/"); }, 2600);
      });
    })();
  </script>
</body>
</html>
