<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" role="img" aria-label="睡在云上的小猫插画">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#ffe2ec" stop-opacity="0.95" />
      <stop offset="0.45" stop-color="#f3e4ff" stop-opacity="0.72" />
      <stop offset="0.78" stop-color="#e4f2f8" stop-opacity="0.28" />
      <stop offset="1" stop-color="#e9f5fa" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffefc9" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ffefc9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdfc" />
      <stop offset="1" stop-color="#fbeef2" />
    </linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fffaf0" />
      <stop offset="1" stop-color="#ffe6bd" />
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="1" stop-color="#f7eef8" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="cloudShade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9c3ea" stop-opacity="0.45" />
      <stop offset="1" stop-color="#d9c3ea" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 柔光背景（径向渐变，不会被裁出方框） -->
  <ellipse cx="198" cy="158" rx="196" ry="158" fill="url(#glow)" />

  <!-- 星星 -->
  <g fill="#f6b9c8" opacity="0.75">
    <path d="M96 76c1.6 5.4 3 6.8 8.4 8.4-5.4 1.6-6.8 3-8.4 8.4-1.6-5.4-3-6.8-8.4-8.4 5.4-1.6 6.8-3 8.4-8.4Z" />
    <path d="M330 168c1.2 4 2.2 5 6.2 6.2-4 1.2-5 2.2-6.2 6.2-1.2-4-2.2-5-6.2-6.2 4-1.2 5-2.2 6.2-6.2Z" />
  </g>
  <g fill="#c9b6ee" opacity="0.5">
    <circle cx="150" cy="58" r="2.6" />
    <circle cx="318" cy="122" r="2" />
    <circle cx="68" cy="150" r="2" />
    <circle cx="352" cy="226" r="2.4" />
  </g>

  <!-- 月亮 -->
  <ellipse cx="300" cy="80" rx="58" ry="55" fill="url(#moonGlow)" />
  <circle cx="300" cy="78" r="30" fill="url(#moon)" />
  <circle cx="291" cy="71" r="5.5" fill="#f7dcae" opacity="0.45" />
  <circle cx="308" cy="88" r="3.6" fill="#f7dcae" opacity="0.38" />

  <!-- 云朵（猫的床） -->
  <ellipse cx="196" cy="272" rx="140" ry="30" fill="url(#cloudShade)" />
  <path d="M92 268c-14 0-24-11-24-23 0-13 11-23 24-23 4-16 19-27 37-27 14 0 27 7 34 18 5-3 11-5 18-5 17 0 31 12 33 28 16 2 28 14 28 29 0 16-13 28-29 28H92Z"
        fill="url(#cloud)" />

  <!-- 尾巴 -->
  <path d="M146 252c-30 2-52-14-52-38 0-19 15-33 34-33 8 0 15 3 20 8"
        fill="none" stroke="#f8e6ee" stroke-width="20" stroke-linecap="round" />
  <path d="M146 252c-30 2-52-14-52-38 0-19 15-33 34-33 8 0 15 3 20 8"
        fill="none" stroke="#fffdfc" stroke-width="13" stroke-linecap="round" />

  <!-- 身体 -->
  <ellipse cx="196" cy="238" rx="74" ry="46" fill="url(#fur)" transform="rotate(-6 196 238)" />
  <path d="M150 268c14 8 38 10 58 5" fill="none" stroke="#f3dde7" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- 前爪 -->
  <ellipse cx="214" cy="270" rx="17" ry="10" fill="#fffdfc" stroke="#f7e6ee" stroke-width="1.5" />
  <ellipse cx="243" cy="266" rx="15" ry="9" fill="#fffdfc" stroke="#f7e6ee" stroke-width="1.5" />

  <!-- 头 -->
  <g>
    <path d="M232 178l4-24c1-6 7-9 12-6l19 12Z" fill="#fffdfc" stroke="#f6e3ec" stroke-width="1.5" />
    <path d="M262 176l14-20c3-5 10-5 13 0l7 22Z" fill="#fffdfc" stroke="#f6e3ec" stroke-width="1.5" />
    <path d="M236 176l3-16 12 8Z" fill="#f9c3d3" />
    <path d="M265 176l9-13 5 15Z" fill="#f9c3d3" />
    <circle cx="257" cy="198" r="36" fill="url(#fur)" />
    <!-- 闭着的眼睛 -->
    <path d="M240 196c3.4 4 8.6 4 12 0" fill="none" stroke="#6b5a68" stroke-width="2.6" stroke-linecap="round" />
    <path d="M266 195c3.4 4 8.6 4 12 0" fill="none" stroke="#6b5a68" stroke-width="2.6" stroke-linecap="round" />
    <!-- 腮红 -->
    <ellipse cx="235" cy="208" rx="7.5" ry="5" fill="#f9aec1" opacity="0.55" />
    <ellipse cx="281" cy="207" rx="7.5" ry="5" fill="#f9aec1" opacity="0.55" />
    <!-- 鼻子与嘴 -->
    <path d="M254 208h6l-3 3.4Z" fill="#e79aae" />
    <path d="M252 215c1.8 2.6 4.2 2.6 6 0M258 215c1.8 2.6 4.2 2.6 6 0" fill="none" stroke="#6b5a68" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    <!-- 胡须 -->
    <g stroke="#e3ccd8" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
      <path d="M228 204l-14-3M228 209l-14 2" />
      <path d="M288 203l14-3M288 208l14 2" />
    </g>
  </g>

  <!-- zzz -->
  <g fill="#b9a4e3" font-family="Quicksand, system-ui, sans-serif" font-weight="700">
    <text x="300" y="196" font-size="17" opacity="0.75">z</text>
    <text x="316" y="176" font-size="21" opacity="0.55">z</text>
    <text x="336" y="150" font-size="26" opacity="0.35">z</text>
  </g>

  <!-- 飘落的花瓣 -->
  <g fill="#f2a0b8" opacity="0.55">
    <path d="M74 210c5-3 9 1 7 6-2 4-7 4-9 1-1-3 0-5 2-7Z" />
    <path d="M120 120c4-2 7 1 6 5-2 3-6 3-7 0-1-2 0-4 1-5Z" opacity="0.8" />
  </g>
</svg>
