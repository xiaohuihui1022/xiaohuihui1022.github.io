<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鸣潮角色猜谜游戏</title>

    <style>
    /* ==================== 样式（已内联，双击即可运行，无需加载外部文件） ==================== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        min-height: 100vh;
        color: #fff;
        display: flex;
        justify-content: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #ffd700, #ff8c00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .top-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 15px 20px;
    }

    .attempt-badge {
        background: linear-gradient(90deg, #00dbde, #fc00ff);
        padding: 8px 16px;
        border-radius: 10px;
        font-weight: bold;
        font-size: 15px;
    }

    .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
    }

    .btn-guess {
        background: linear-gradient(90deg, #00dbde, #fc00ff);
        color: #fff;
    }

    .btn-restart {
        background: linear-gradient(90deg, #ffd700, #ff8c00);
        color: #1a1a2e;
    }

    .legend {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 13px;
        color: #ccc;
        flex-wrap: wrap;
    }

    .legend .item {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .legend .color-box {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        display: inline-block;
    }

    .color-green { background: #2ecc71; }
    .color-orange { background: #f39c12; }
    .color-gray { background: #95a5a6; }

    .table-wrapper {
        overflow-x: auto;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 20px;
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }

    .data-table thead {
        position: sticky;
        top: 0;
    }

    .data-table th, .data-table td {
        padding: 12px 16px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .data-table th {
        background: rgba(0, 0, 0, 0.45);
        color: #ffd700;
        font-weight: bold;
        letter-spacing: 1px;
        white-space: nowrap;
    }

    .data-table tbody tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.03);
    }

    .data-table tbody tr:hover {
        background: rgba(255, 255, 255, 0.08);
    }

    .data-table .rownum {
        color: #666;
        font-family: monospace;
        font-size: 13px;
        background: rgba(0, 0, 0, 0.3);
        border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .match-green  { background: #2ecc71 !important; color: #0a0a0a; font-weight: bold; }
    .match-orange { background: #f39c12 !important; color: #0a0a0a; font-weight: bold; }
    .match-gray   { background: #7f8c8d !important; color: #e0e0e0; }

    .empty-state {
        text-align: center;
        color: #888;
        padding: 30px;
        font-size: 15px;
    }

    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal {
        background: #1f1f3a;
        border-radius: 16px;
        padding: 30px 35px;
        max-width: 420px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal .result-icon {
        font-size: 50px;
        margin-bottom: 10px;
    }

    .modal h2 {
        font-size: 24px;
        margin-bottom: 12px;
    }

    .modal.win h2 { color: #2ecc71; }
    .modal.lose h2 { color: #e74c3c; }

    .modal p {
        color: #ccc;
        font-size: 15px;
        line-height: 1.7;
        margin-bottom: 10px;
    }

    .modal .correct-answer {
        background: rgba(255, 215, 0, 0.1);
        border: 1px dashed #ffd700;
        border-radius: 10px;
        padding: 12px;
        margin: 15px 0;
        font-size: 16px;
        color: #ffd700;
    }

    .modal .modal-actions {
        margin-top: 15px;
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    .bottom-input-area {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        background: rgba(26, 26, 46, 0.92);
        backdrop-filter: blur(10px);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.4);
        z-index: 500;
    }

    .autocomplete-wrap {
        position: relative;
        flex: none;
        width: 380px;
    }

    .autocomplete-wrap input {
        width: 100%;
        padding: 13px 16px;
        border-radius: 10px;
        border: 2px solid #3a3a5a;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 16px;
        outline: none;
        transition: border-color 0.3s;
    }

    .autocomplete-wrap input:focus {
        border-color: #ffd700;
    }

    .autocomplete-wrap input:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .autocomplete-wrap input::placeholder {
        color: #888;
    }

    .autocomplete-list {
        position: absolute;
        bottom: calc(100% + 6px);
        left: 0;
        right: 0;
        max-height: 260px;
        overflow-y: auto;
        background: #16162a;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 600;
    }

    .autocomplete-list.active {
        display: block;
    }

    .autocomplete-list .ac-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 14px;
        cursor: pointer;
        font-size: 14px;
        color: #ddd;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .autocomplete-list .ac-item:last-child {
        border-bottom: none;
    }

    .autocomplete-list .ac-item .ac-name {
        font-weight: 600;
        color: #fff;
    }

    .autocomplete-list .ac-item .ac-attr,
    .autocomplete-list .ac-item .ac-stars {
        font-size: 12px;
        color: #999;
        margin-left: 14px;
    }

    .autocomplete-list .ac-item .ac-suffix {
        font-size: 11px;
        color: #666;
        font-style: italic;
        margin-left: 8px;
    }

    .autocomplete-list .ac-item:hover,
    .autocomplete-list .ac-item.active {
        background: rgba(255, 215, 0, 0.15);
    }

    .autocomplete-list .ac-item.active .ac-name {
        color: #ffd700;
    }

    footer {
        text-align: center;
        margin-top: 20px;
        color: #666;
        font-size: 12px;
        padding-bottom: 90px;
    }

    /* ==================== 手机端适配（≤ 600px） ==================== */
    @media (max-width: 600px) {
        body {
            padding: 12px 10px 120px;   /* 底部留出空间，避免被固定输入区遮挡 */
        }

        h1 {
            font-size: 22px;
        }

        .subtitle {
            font-size: 13px;
            margin-bottom: 20px;
        }

        .top-bar {
            padding: 10px 12px;
            margin-bottom: 15px;
        }

        .attempt-badge {
            font-size: 13px;
            padding: 6px 12px;
        }

        .legend {
            gap: 12px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        /* 表格单元格缩小，保证横向滚动时更紧凑 */
        .data-table {
            font-size: 13px;
        }

        .data-table th, .data-table td {
            padding: 9px 10px;
        }

        /* 让表格可横向滚动（已启用 overflow-x） */
        .table-wrapper {
            margin-bottom: 15px;
        }

        footer {
            font-size: 11px;
            padding-bottom: 20px;
        }

        /* 底部输入区：手机上改为多行紧凑布局 */
        .bottom-input-area {
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        }

        .autocomplete-wrap {
            width: 100%;
            order: -1;   /* 输入框放到第一行，占满整行 */
            flex: 1 1 100%;
        }

        .autocomplete-wrap input {
            font-size: 16px;   /* 避免 iOS 聚焦时自动放大 */
            padding: 12px 14px;
        }

        .btn {
            flex: 1;
            padding: 12px 8px;
            font-size: 15px;
            min-width: 0;
        }

        /* 自动补全下拉在手机上稍微抬高 */
        .autocomplete-list {
            max-height: 200px;
        }

        .autocomplete-list .ac-item {
            padding: 11px 12px;
        }

        .autocomplete-list .ac-suffix {
            display: none;   /* 手机上隐藏 "Tab 补全" 提示，节省空间 */
        }

        /* 弹窗：手机上更紧凑，接近全屏 */
        .modal {
            width: 92%;
            padding: 24px 18px;
        }

        .modal h2 {
            font-size: 20px;
        }

        .modal .modal-actions {
            gap: 10px;
        }
    }

    /* 很窄的屏幕（≤ 380px）进一步微调 */
    @media (max-width: 380px) {
        .legend {
            gap: 8px;
            font-size: 11px;
        }

        .data-table th, .data-table td {
            padding: 8px 8px;
        }
    }
    </style>
</head>

            <div class="empty-state" id="emptyState">请输入角色名开始猜测 👆</div>
        </div>

        <footer>提示：根据每个字段的底色判断与目标数据的接近程度，逐步缩小范围！</footer>

        <!-- 底部输入区：输入框(带自动补全) + 提交按钮 -->

            <button class="btn btn-guess" id="btnGuess" onclick="guessCharacter()">🔍 提交猜测</button>
            <button class="btn btn-restart" id="btnRestart" onclick="restartGame()">🔄 重新开始</button>
        </div>
    </div>

    <!-- 弹窗（单次猜测反馈 / 游戏结束结果） -->
    <div class="modal-overlay" id="gameOverModal">
        <div class="modal" id="resultModal">
            <div class="result-icon" id="resultIcon"></div>
            <h2 id="resultTitle"></h2>
            <div class="correct-answer" id="correctAnswer"></div>
            <p id="resultDetail"></p>
            <div class="modal-actions">
                <button class="btn btn-guess" id="btnAgain" onclick="restartGame()">🎮 再来一把</button>
                <button class="btn btn-restart" id="btnContinue" onclick="closeModal()">👍 知道了</button>

        </div>
    </div>

    ];

    // ==================== 游戏逻辑（已内联，双击即可运行） ====================
    const MAX_ATTEMPTS = 4;
    let currentTarget = null;
    let guessHistory = [];
    let gameOver = false;

    let allNames = [];
    let suggestions = [];
    let activeIndex = -1;

    // 对比逻辑
    function compareField(targetVal, guessVal, fieldName) {
        if (targetVal == guessVal) return 'match';
        if (fieldName === 'star_rating') return 'near';
        if (fieldName === 'version') {
            if (Math.abs(targetVal - guessVal) <= 0.2) return 'near';
            return 'different';
        }
        return 'different';
    }

    function buildCompare(target, guess) {
        return {
            attribute:   compareField(target.attribute,   guess.attribute,   'attribute'),
            star_rating: compareField(target.star_rating, guess.star_rating, 'star_rating'),
            weapon:      compareField(target.weapon,      guess.weapon,      'weapon'),
            birthplace:  compareField(target.birthplace,  guess.birthplace,  'birthplace'),
            version:     compareField(target.version,     guess.version,     'version'),
        };
    }

    function starStr(num) { return '★'.repeat(num); }
    function formatVersion(v) { return parseFloat(v).toFixed(1); }
    function statusClass(status) {
        if (status === 'match') return 'match-green';
        if (status === 'near') return 'match-orange';
        return 'match-gray';
    }

    function renderAttemptBadge() {
        const used = guessHistory.length;
        document.getElementById('attemptBadge').textContent =
            used >= MAX_ATTEMPTS ? '游戏结束' : `第 ${used + 1} / ${MAX_ATTEMPTS} 次猜测`;
    }

    function makeCell(text, extraClass = '', cellClass = '', status = null) {
        const td = document.createElement('td');
        td.textContent = text;
        if (extraClass) td.classList.add(extraClass);
        if (cellClass) td.classList.add(cellClass);
        if (status) td.classList.add(statusClass(status));
        return td;
    }

    function renderTable() {
        const tbody = document.querySelector('#resultTable tbody');
        const emptyState = document.getElementById('emptyState');
        tbody.innerHTML = '';
        if (guessHistory.length === 0) { emptyState.style.display = 'block'; return; }
        emptyState.style.display = 'none';
        guessHistory.forEach((rec, idx) => {
            const g = rec.guess;
            const c = rec.compare;
            const tr = document.createElement('tr');
            tr.appendChild(makeCell(String(idx + 1), 'rownum'));
            tr.appendChild(makeCell(g.name));
            tr.appendChild(makeCell(g.attribute, null, null, c.attribute));
            tr.appendChild(makeCell(starStr(g.star_rating), null, null, c.star_rating));
            tr.appendChild(makeCell(g.weapon, null, null, c.weapon));
            tr.appendChild(makeCell(g.birthplace, null, null, c.birthplace));
            tr.appendChild(makeCell(formatVersion(g.version), null, null, c.version));
            tbody.appendChild(tr);
        });
    }

    function startGame() {
        if (CHARACTERS.length === 0) { alert('没有可用角色数据'); return; }
        currentTarget = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
        guessHistory = [];
        gameOver = false;
        document.getElementById('guessInput').value = '';
        document.getElementById('guessInput').disabled = false;
        document.getElementById('btnGuess').disabled = false;
        document.getElementById('emptyState').textContent = '请输入角色名开始猜测 👆';
        hideSuggestions();
        renderAttemptBadge();
        renderTable();
        document.getElementById('guessInput').focus();
    }

    function guessCharacter() {
        if (!currentTarget || gameOver) return;
        const name = document.getElementById('guessInput').value.trim();
        if (!name) { alert('请输入角色名！'); return; }
        const guessChar = CHARACTERS.find(c => c.name === name);
        if (!guessChar) { alert(`不存在名为「${name}」的角色`); return; }
        const compare = buildCompare(currentTarget, guessChar);
        guessHistory.push({ guess: guessChar, compare: compare });
        document.getElementById('guessInput').value = '';
        hideSuggestions();
        renderAttemptBadge();
        renderTable();
        const allMatch = Object.values(compare).every(v => v === 'match');
        const isWin = allMatch;
        const isLose = guessHistory.length >= MAX_ATTEMPTS && !isWin;
        if (isWin || isLose) endGame(isWin, currentTarget);
    }

    function endGame(isWin, target) {
        gameOver = true;
        document.getElementById('guessInput').disabled = true;
        document.getElementById('btnGuess').disabled = true;
        const modal = document.getElementById('gameOverModal');
        const m = document.getElementById('resultModal');
        m.className = 'modal ' + (isWin ? 'win' : 'lose');
        document.getElementById('resultIcon').textContent = isWin ? '🎉' : '😢';
        document.getElementById('resultTitle').textContent = isWin ? '恭喜你，猜对了！' : '很遗憾，机会用完了';
        document.getElementById('correctAnswer').style.display = 'block';
        document.getElementById('correctAnswer').innerHTML = `正确答案是：<br><strong>${target.name}</strong>`;
        document.getElementById('resultDetail').textContent =
            isWin ? `你用了 ${guessHistory.length} / ${MAX_ATTEMPTS} 次就猜出了正确答案！` : '4 次机会都用完了，来看看正确答案吧！';
        document.getElementById('btnAgain').style.display = 'inline-block';
        document.getElementById('btnContinue').style.display = 'inline-block';
        modal.classList.add('active');
    }

    function closeModal() { document.getElementById('gameOverModal').classList.remove('active'); }
    function restartGame() { document.getElementById('gameOverModal').classList.remove('active'); startGame(); }

    function loadNames() {
        allNames = CHARACTERS.map(c => ({ name: c.name, attribute: c.attribute, star_rating: c.star_rating }));
    }

    function filterSuggestions(keyword) {
        if (!keyword) return [];
        const kw = keyword.toLowerCase();
        return allNames.filter(name => name.name.toLowerCase().includes(kw)).slice(0, 10);
    }

    function renderSuggestions() {
        const list = document.getElementById('autocompleteList');
        const keyword = document.getElementById('guessInput').value.trim();
        suggestions = filterSuggestions(keyword);
        activeIndex = -1;
        if (suggestions.length === 0) { hideSuggestions(); return; }
        list.innerHTML = '';
        suggestions.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = 'ac-item' + (i === activeIndex ? ' active' : '');
            div.innerHTML =
                `<span class="ac-name">${item.name}</span>` +
                `<span class="ac-attr">${item.attribute}</span>` +
                `<span class="ac-stars">${starStr(item.star_rating)}</span>` +
                `<span class="ac-suffix">Tab 补全</span>`;
            div.onclick = () => applySuggestion(item.name);
            list.appendChild(div);
        });
        list.classList.add('active');
    }

    function applySuggestion(name) {
        const input = document.getElementById('guessInput');
        input.value = name;
        hideSuggestions();
        input.focus();
    }

    function hideSuggestions() {
        const list = document.getElementById('autocompleteList');
        list.innerHTML = '';
        list.classList.remove('active');
        suggestions = [];
        activeIndex = -1;
    }

    document.getElementById('guessInput').addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
            if (suggestions.length === 0) {
                const kw = this.value.trim();
                const matched = filterSuggestions(kw);
                if (matched.length > 0) applySuggestion(matched[0].name);
                e.preventDefault();
                return;
            }
            const idx = activeIndex >= 0 ? activeIndex : 0;
            applySuggestion(suggestions[idx].name);
            e.preventDefault();
            return;
        }
        if (e.key === 'ArrowDown') {
            if (suggestions.length > 0) { activeIndex = (activeIndex + 1) % suggestions.length; highlightActive(); e.preventDefault(); }
            return;
        }
        if (e.key === 'ArrowUp') {
            if (suggestions.length > 0) { activeIndex = (activeIndex - 1 + suggestions.length) % suggestions.length; highlightActive(); e.preventDefault(); }
            return;
        }
        if (e.key === 'Enter') {
            e.preventDefault();
            if (suggestions.length > 0) {
                const idx = activeIndex >= 0 ? activeIndex : 0;
                const targetName = suggestions[idx].name;
                if (this.value.trim() !== targetName) applySuggestion(targetName);
                else hideSuggestions();
            } else hideSuggestions();
            guessCharacter();
            return;
        }
        if (e.key === 'Escape') hideSuggestions();
    });

    function highlightActive() {
        const items = document.querySelectorAll('#autocompleteList .ac-item');
        items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    }

    document.getElementById('guessInput').addEventListener('input', function () {
        if (gameOver) return;
        renderSuggestions();
    });

    document.addEventListener('DOMContentLoaded', () => { loadNames(); startGame(); });
    </script>
</body>
</html>
